<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Sistema de Reforço Escolar</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 10c0-2.2 1.8-4 4-4h9v28h-9c-2.2 0-4-1.8-4-4V10z" fill="#1F4A42"/>
          <path d="M34 10c0-2.2-1.8-4-4-4h-9v28h9c2.2 0 4-1.8 4-4V10z" fill="#2E6358"/>
          <path d="M17 8v24" stroke="#D9A441" stroke-width="1.5"/>
          <path d="M11 13h4M11 18h4M11 23h4" stroke="#EAF1EE" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M25 13h4M25 18h4M25 23h4" stroke="#EAF1EE" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <h1>Sistema de Reforço</h1>
        <p>Entre com sua conta de administração ou de professor</p>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-danger hidden"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;" id="login-btn">Entrar</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const result = await api.post('/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        window.location.href = result.type === 'teacher' ? '/professor.html' : '/';
      } catch (err) {
        errEl.textContent = err.message || 'Não foi possível entrar.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    // Se já estiver logado, pula direto pro app certo
    api.get('/api/auth/me').then(r => {
      if (r.user) window.location.href = r.user.type === 'teacher' ? '/professor.html' : '/';
    });
  </script>
</body>
</html>
