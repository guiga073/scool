        <h1>Olimais</h1>
        <p>Entre com sua conta de administração ou de professor</p>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-danger hidden"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;" id="login-btn">Entrar</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const result = await api.post('/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        window.location.href = result.type === 'teacher' ? '/professor.html' : '/';
      } catch (err) {
        errEl.textContent = err.message || 'Não foi possível entrar.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    // Se já estiver logado, pula direto pro app certo
    api.get('/api/auth/me').then(r => {
      if (r.user) window.location.href = r.user.type === 'teacher' ? '/professor.html' : '/';
    });
  </script>
</body>
</html>
