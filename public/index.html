<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Reforço Escolar</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-scrim" id="scrim"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 10c0-2.2 1.8-4 4-4h9v28h-9c-2.2 0-4-1.8-4-4V10z" fill="#EAF1EE"/>
          <path d="M34 10c0-2.2-1.8-4-4-4h-9v28h9c2.2 0 4-1.8 4-4V10z" fill="#B9CBC5"/>
          <path d="M17 8v24" stroke="#D9A441" stroke-width="1.5"/>
        </svg>
        <div class="brand-name">Reforço Escolar<small>Painel de gestão</small></div>
      </div>
      <ul class="nav-list" id="nav-list">
        <li class="nav-item" data-page="dashboard"><a href="#/dashboard">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 10L10 3l7 7M5 8.5V17h10V8.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Painel</a></li>
        <li class="nav-item" data-page="alunos"><a href="#/alunos">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.5" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 17c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Alunos</a></li>
        <li class="nav-item" data-page="professores"><a href="#/professores">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M7 17h6M10 14v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Professores</a></li>
        <li class="nav-item" data-page="agendamento"><a href="#/agendamento">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h14M7 2.5v3M13 2.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Agendamento</a></li>
        <li class="nav-item" data-page="pagamentos"><a href="#/pagamentos">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5.5" width="15" height="10" rx="1.8" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 9h15" stroke="currentColor" stroke-width="1.6"/></svg>
          Pagamentos</a></li>
      </ul>
      <div class="sidebar-footer">
        <div id="admin-name">—</div>
        <button id="logout-btn">Sair</button>
      </div>
    </nav>

    <div class="main-area">
      <div class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Abrir menu">
          <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <div class="brand-name" style="font-size:15px;">Reforço Escolar</div>
        <div style="width:22px;"></div>
      </div>
      <div class="page-content" id="page-root">
        <div class="loading-dots">Carregando…</div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/availability-grid.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/students.js"></script>
  <script src="/js/pages/teachers.js"></script>
  <script src="/js/pages/scheduling.js"></script>
  <script src="/js/pages/payments.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
